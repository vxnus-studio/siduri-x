version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: siduri
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siduri_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siduri"]
      interval: 2s
      timeout: 5s
      retries: 5

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "50021:50021"

