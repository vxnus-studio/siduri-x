name: Sync & Check Version Parity

on:
  push:
    branches:
      - main
    paths:
      - 'cli/package.json'
      - 'packages/**/package.json'
      - 'scripts/sync-versions.mjs'
  pull_request:
    paths:
      - 'cli/package.json'
      - 'packages/**/package.json'
      - 'README.md'
      - 'apps/siduri-web-astro/**'
      - 'scripts/sync-versions.mjs'
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Version Parity
        id: sync_step
        run: |
          node scripts/sync-versions.mjs

      - name: Check for changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-commit synced versions (on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md apps/siduri-web-astro/
          git commit -m "chore(release): synchronize version references with package.json SSOT [skip ci]"
          git push

      - name: Fail PR if versions were out of sync
        if: github.event_name == 'pull_request' && steps.git_status.outputs.has_changes == 'true'
        run: |
          echo "🚨 Version references in README.md or Astro website are out of sync with package.json files!"
          echo "Please run 'pnpm run sync:versions' locally and commit the changes."
          git diff
          exit 1
