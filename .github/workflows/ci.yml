name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Typecheck, Test & Release Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: node scripts/sync-versions.mjs --check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Verify release packaging
        run: node cli/dist/release-check.js
